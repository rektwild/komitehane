services:
  academic-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: academic_test
      POSTGRES_PASSWORD: academic_local_test_only
      POSTGRES_DB: komitehane_academic_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic_test -d komitehane_academic_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
