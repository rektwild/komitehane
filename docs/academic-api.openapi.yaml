openapi: 3.1.0
info:
  title: Komitehane Academic API
  version: 1.0.0-draft
  description: >-
    Read-only academic data and non-persistent calculations. Academic data
    requires the feature flag, configured current academic year, a separate
    read-only database role, and verified published rules. The process-local
    rate limit is best effort and is not a distributed abuse protection system.
servers:
  - url: /api/v1
paths:
  /universities:
    get:
      summary: Active universities
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 10000, default: 0}}
      responses:
        '200': {$ref: '#/components/responses/ItemList'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /faculties:
    get:
      summary: Faculties in a university
      parameters:
        - {name: universityId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {$ref: '#/components/responses/ItemList'}
        '400': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /programs:
    get:
      summary: Programs in a faculty
      parameters:
        - {name: facultyId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {$ref: '#/components/responses/ItemList'}
        '400': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /courses:
    get:
      summary: Courses with verified published midterm rules for the current year
      parameters:
        - {$ref: '#/components/parameters/ProgramId'}
        - {$ref: '#/components/parameters/ClassYear'}
        - {$ref: '#/components/parameters/Period'}
      responses:
        '200': {$ref: '#/components/responses/ItemList'}
        '400': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /grading-rules:
    get:
      summary: Current published verified rule for an exact academic context
      parameters:
        - {name: programId, in: query, schema: {type: string, format: uuid}}
        - {name: classYear, in: query, schema: {type: integer, minimum: 1, maximum: 12}}
        - {name: period, in: query, schema: {enum: [ANNUAL, FALL, SPRING]}}
        - {name: system, in: query, schema: {enum: [COMMITTEE, MIDTERM]}}
        - {name: versionId, in: query, description: Exact version lookup; cannot be combined with scope parameters, schema: {type: string, format: uuid}}
        - {name: includeHistorical, in: query, description: Use true with versionId for historical records, schema: {type: boolean}}
        - {name: courseId, in: query, description: Required for MIDTERM and forbidden for COMMITTEE, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Published rule and sources
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Rule'}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /calculate:
    post:
      summary: Calculate without storing personal grades
      description: >-
        Body limit 16384 bytes; same-origin browser requests. A client cannot
        assert OFFICIAL_VERIFIED. Historical versions require explicit
        includeHistorical. A submitted override always marks the result CUSTOM.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/ManualCalculation'}
                - {$ref: '#/components/schemas/OfficialCalculation'}
      responses:
        '200':
          description: Calculation result
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/CalculationResult'}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  parameters:
    ProgramId: {name: programId, in: query, required: true, schema: {type: string, format: uuid}}
    ClassYear: {name: classYear, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 12}}
    Period: {name: period, in: query, required: true, schema: {enum: [ANNUAL, FALL, SPRING]}}
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: object, required: [code, message], properties: {code: {type: string}, message: {type: string}}}
    ItemList:
      description: Active catalog entries
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: {type: object, required: [id, name, slug], properties: {id: {type: string, format: uuid}, name: {type: string}, slug: {type: string}, durationYears: {type: integer}}}
  schemas:
    Decimal:
      oneOf:
        - {type: number, minimum: 0, maximum: 100, multipleOf: 0.01}
        - {type: string, maxLength: 8, pattern: '^[0-9]{1,3}([.,][0-9]{1,2})?$'}
    Mode: {enum: [COURSE_GRADE, MINIMUM_FINAL]}
    ManualCalculation:
      type: object
      additionalProperties: false
      required: [source, mode, components, finalWeight]
      properties:
        source: {const: CUSTOM}
        mode: {$ref: '#/components/schemas/Mode'}
        components:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [grade, weight]
            properties: {grade: {$ref: '#/components/schemas/Decimal'}, weight: {$ref: '#/components/schemas/Decimal'}}
        finalWeight: {$ref: '#/components/schemas/Decimal'}
        finalGrade: {$ref: '#/components/schemas/Decimal'}
        passingGrade: {$ref: '#/components/schemas/Decimal'}
      description: finalGrade is required for COURSE_GRADE; passingGrade for MINIMUM_FINAL. Weights must total 100 and finalWeight must exceed zero.
    OfficialCalculation:
      type: object
      additionalProperties: false
      required: [ruleVersionId, mode, grades]
      properties:
        ruleVersionId: {type: string, format: uuid}
        mode: {$ref: '#/components/schemas/Mode'}
        grades: {type: array, minItems: 1, maxItems: 10, items: {$ref: '#/components/schemas/Decimal'}}
        finalGrade: {$ref: '#/components/schemas/Decimal'}
        includeHistorical: {type: boolean, default: false}
        overrides:
          type: object
          additionalProperties: false
          properties:
            weights: {type: array, minItems: 1, maxItems: 10, items: {$ref: '#/components/schemas/Decimal'}}
            finalWeight: {$ref: '#/components/schemas/Decimal'}
            passingGrade: {$ref: '#/components/schemas/Decimal'}
    Rule:
      type: object
      required: [ruleId, versionId, academicYearStart, classYear, period, system, passingGrade, components, sources]
      properties:
        ruleId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        academicYearStart: {type: integer}
        classYear: {type: integer}
        period: {enum: [ANNUAL, FALL, SPRING]}
        system: {enum: [COMMITTEE, MIDTERM]}
        passingGrade: {type: string}
        components:
          type: array
          items: {type: object, required: [type, position, weightPercent], properties: {type: {enum: [COMMITTEE, MIDTERM, FINAL]}, position: {type: integer}, weightPercent: {type: string}}}
        sources:
          type: array
          items: {type: object, required: [sourceUrl, sourceType, verifiedAt], properties: {sourceUrl: {type: string, format: uri}, sourceType: {type: string}, verifiedAt: {type: string, format: date-time}, sourceTitle: {type: [string, 'null']}}}
    CalculationResult:
      type: object
      required: [status, value, displayValue, currentContribution, source]
      properties:
        status: {enum: [CALCULATED, TARGET_ALREADY_MET, IMPOSSIBLE_WITH_MAX_100]}
        value: {type: number}
        displayValue: {type: number, description: Required minimum final rounded upwards to two decimal places.}
        currentContribution: {type: number}
        source: {enum: [CUSTOM, OFFICIAL_VERIFIED]}
        versionId: {type: string, format: uuid}
        versionStatus: {enum: [PUBLISHED, SUPERSEDED]}
        academicYearStart: {type: integer}
