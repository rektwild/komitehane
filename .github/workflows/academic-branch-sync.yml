name: Academic PR one-time main sync
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/academic-branch-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    if: github.event.pull_request.number == 5 && github.event.pull_request.head.repo.full_name == 'rektwild/komitehane' && github.event.pull_request.head.ref == 'codex/academic-db-wip-6227081'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/academic-db-wip-6227081
          fetch-depth: 0
          persist-credentials: true
      - name: Sync latest main without overwriting conflicts
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-edit -m "chore(academic): synchronize PR #5 with main" origin/main; then
            echo "::error::Merge conflict. Stopping without push."
            git status --short
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git push origin HEAD:refs/heads/codex/academic-db-wip-6227081
