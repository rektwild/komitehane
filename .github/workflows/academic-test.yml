name: Academic isolated PostgreSQL tests
on:
  pull_request:
    paths:
      - '.github/workflows/academic-test.yml'
      - 'drizzle/academic/**'
      - 'lib/academic/**'
      - 'scripts/academic/**'
      - 'tests/academic/**'
      - 'tests/fixtures/academic/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  academic-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: academic_test
          POSTGRES_PASSWORD: academic_local_test_only
          POSTGRES_DB: komitehane_academic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academic_test -d komitehane_academic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm academic:check
      - run: pnpm academic:test:postgres
        env:
          ACADEMIC_TEST_DATABASE_URL: postgresql://academic_test:academic_local_test_only@127.0.0.1:5432/komitehane_academic_test
