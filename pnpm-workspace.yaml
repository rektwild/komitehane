allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: false
  unrs-resolver: false

# Security floors for transitive dependencies that upstream packages pin to
# vulnerable versions (see `pnpm audit`). Remove an entry once the parent
# package ships a patched version on its own.
overrides:
  dompurify@<3.4.18: 3.4.18
  happy-dom@<21.0.4: ^21.0.4
  brace-expansion@>=5.0.0 <5.0.13: ^5.0.13
  minimatch@>=10.0.0 <11.0.1: ^11.0.1
